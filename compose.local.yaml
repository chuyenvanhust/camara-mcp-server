name: camara-mcp-test
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: camara-mcp-server:local-test
    env_file:
      - .env
    environment:
      BIND_HOST: "0.0.0.0"
      PORT: "3000"
      MCP_SERVER_URL: "http://localhost:3001/mcp"
      GATEWAY_MODULES_FILE: "/app/gateway.toml"
      UPSTREAM_PRIVATE_KEY_PATH: "/run/secrets/upstream-private.pem"
      UPSTREAM_CLIENT_ASSERTION_PATH: ""
      LOG_TO_FILE: "false"
      LOG_LEVEL: "info"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - type: bind
        source: ./keys/upstream-private.pem
        target: /run/secrets/upstream-private.pem
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 60s
