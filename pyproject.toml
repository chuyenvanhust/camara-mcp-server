[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "camara-server"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "httpx2==2.13.1", "PyJWT[crypto]==2.15.1", "python-dotenv==1.2.4", "jsonschema==4.26.0", "uvicorn==0.54.0"]

[project.scripts]
camara-mcp-server = "camara_server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["camara_server*"]
