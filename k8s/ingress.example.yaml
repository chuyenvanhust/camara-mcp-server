apiVersion: networking.k8s.io/v1
# Routing example only. Attach the Open Gateway OAuth policy before exposing.
# Not included in default kustomization: the backend must stay behind the gateway.
kind: Ingress
metadata:
  name: camara-mcp
spec:
  # Replace with an existing IngressClass supported by your platform.
  ingressClassName: replace-ingress-class
  tls:
    - hosts:
        - mcp.example.vn
      secretName: camara-mcp-tls
  rules:
    - host: mcp.example.vn
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: camara-mcp
                port:
                  name: http
